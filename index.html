<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Despensa">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2B6B5A">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Mi despensa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EDF1EC;--surface:#FFFFFF;--ink:#1C2B27;--muted:#5E6F69;--line:#CFD9D3;
  --accent:#2B6B5A;--accent-ink:#FFFFFF;--low:#B77A00;--low-bg:#FFF1CF;--out:#A63D3D;--out-bg:#FBE3E1;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121A18;--surface:#1B2623;--ink:#E6EEEA;--muted:#9BAEA7;--line:#2E3D38;
    --accent:#5FBFA5;--accent-ink:#0E1A17;--low:#F0B94A;--low-bg:#3A2F12;--out:#F08A8A;--out-bg:#3D1F1F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121A18;--surface:#1B2623;--ink:#E6EEEA;--muted:#9BAEA7;--line:#2E3D38;
  --accent:#5FBFA5;--accent-ink:#0E1A17;--low:#F0B94A;--low-bg:#3A2F12;--out:#F08A8A;--out-bg:#3D1F1F;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.4}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:2.1rem;font-weight:800;letter-spacing:-.02em;margin:8px 0 2px}
.sub{color:var(--muted);margin:0 0 18px}
form.add{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:1fr 90px 100px;gap:10px}
form.add .full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
input,select,button{font:inherit;color:var(--ink)}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 16px;font-weight:600;cursor:pointer}
.tools{display:flex;gap:10px;margin:22px 0 6px;align-items:center}
.tools input{flex:1}
.count{color:var(--muted);font-size:.9rem;white-space:nowrap}
h2{font-size:1.05rem;font-weight:800;margin:22px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
li.low{border-color:var(--low);background:var(--low-bg)}
li.out{border-color:var(--out);background:var(--out-bg)}
.name{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}
.name small{display:block;font-weight:400;color:var(--muted)}
li.low .name small{color:var(--low)}
li.out .name small{color:var(--out)}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:1.3rem;line-height:1;cursor:pointer}
.qty button:active{background:var(--accent);color:var(--accent-ink)}
.qty span{min-width:64px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.del{background:none;border:0;color:var(--muted);cursor:pointer;font-size:1.2rem;padding:6px}
.del:hover{color:var(--out)}
.empty{text-align:center;color:var(--muted);padding:32px 12px;border:2px dashed var(--line);border-radius:14px;margin-top:18px}
@media (max-width:420px){form.add{grid-template-columns:1fr 1fr}.qty span{min-width:52px}}
</style>
</head>
<body>
<main>
  <h1>Mi despensa</h1>
  <p class="sub">Qué tienes en casa y cuánto queda.</p>

  <form class="add" id="f">
    <label class="full">Producto
      <input id="n" required maxlength="60" placeholder="Arroz, aceite, latas de atún…" autocomplete="off">
    </label>
    <label>Categoría
      <input id="c" list="cats" maxlength="30" placeholder="Opcional">
      <datalist id="cats"></datalist>
    </label>
    <label>Cantidad
      <input id="q" type="number" min="0" step="any" value="1" required>
    </label>
    <label>Unidad
      <select id="u">
        <option>ud.</option><option>kg</option><option>g</option><option>l</option>
        <option>ml</option><option>paquetes</option><option>latas</option><option>botes</option><option>botellas</option>
      </select>
    </label>
    <button class="primary full" type="submit">Añadir a la despensa</button>
  </form>

  <div class="tools">
    <input id="s" type="search" placeholder="Buscar producto" aria-label="Buscar producto">
    <span class="count" id="count"></span>
  </div>

  <div id="list"></div>
</main>

<script>
(function(){
  var KEY="despensa-v1", items=[];
  try{ var raw=localStorage.getItem(KEY); if(raw) items=JSON.parse(raw)||[]; }catch(e){ items=[]; }
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(items)); }catch(e){} }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
  function step(u){ return (u==="kg"||u==="l")?0.5:(u==="g"||u==="ml")?100:1; }
  function fmt(n){ return String(Math.round(n*100)/100).replace(".",","); }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

  var list=document.getElementById("list"), search=document.getElementById("s"), count=document.getElementById("count");

  function render(){
    var term=search.value.trim().toLowerCase();
    var shown=items.filter(function(i){return i.name.toLowerCase().indexOf(term)>-1||(i.cat||"").toLowerCase().indexOf(term)>-1;});
    count.textContent=items.length+(items.length===1?" producto":" productos");

    var cats=[]; items.forEach(function(i){ if(i.cat&&cats.indexOf(i.cat)<0) cats.push(i.cat); });
    document.getElementById("cats").innerHTML=cats.map(function(c){return '<option value="'+esc(c)+'">';}).join("");

    if(!items.length){ list.innerHTML='<div class="empty">Tu despensa está vacía. Añade el primer producto arriba.</div>'; return; }
    if(!shown.length){ list.innerHTML='<div class="empty">No hay productos que coincidan con «'+esc(search.value)+'».</div>'; return; }

    var groups={};
    shown.forEach(function(i){ var g=i.cat||"Sin categoría"; (groups[g]=groups[g]||[]).push(i); });
    var names=Object.keys(groups).sort(function(a,b){
      if(a==="Sin categoría") return 1; if(b==="Sin categoría") return -1; return a.localeCompare(b,"es");
    });
    list.innerHTML=names.map(function(g){
      var rows=groups[g].sort(function(a,b){return a.name.localeCompare(b.name,"es");}).map(function(i){
        var state=i.q<=0?"out":(i.q<=step(i.u)&&i.u!=="g"&&i.u!=="ml"?"low":"");
        var note=state==="out"?"Agotado":state==="low"?"Queda poco":"";
        return '<li class="'+state+'" data-id="'+i.id+'">'+
          '<div class="name">'+esc(i.name)+(note?'<small>'+note+'</small>':'')+'</div>'+
          '<div class="qty">'+
            '<button data-a="minus" aria-label="Quitar uno de '+esc(i.name)+'">−</button>'+
            '<span>'+fmt(i.q)+' '+esc(i.u)+'</span>'+
            '<button data-a="plus" aria-label="Añadir uno de '+esc(i.name)+'">+</button>'+
          '</div>'+
          '<button class="del" data-a="del" aria-label="Eliminar '+esc(i.name)+'">✕</button>'+
        '</li>';
      }).join("");
      return '<h2>'+esc(g)+'</h2><ul>'+rows+'</ul>';
    }).join("");
  }

  document.getElementById("f").addEventListener("submit",function(e){
    e.preventDefault();
    var name=document.getElementById("n").value.trim();
    var cat=document.getElementById("c").value.trim();
    var q=parseFloat(document.getElementById("q").value);
    var u=document.getElementById("u").value;
    if(!name||isNaN(q)||q<0) return;
    var found=items.filter(function(i){return i.name.toLowerCase()===name.toLowerCase()&&i.u===u;})[0];
    if(found){ found.q+=q; if(cat) found.cat=cat; }
    else items.push({id:uid(),name:name,cat:cat,q:q,u:u});
    save(); render();
    document.getElementById("n").value=""; document.getElementById("q").value="1"; document.getElementById("n").focus();
  });

  list.addEventListener("click",function(e){
    var b=e.target.closest("button[data-a]"); if(!b) return;
    var li=b.closest("li"), id=li.getAttribute("data-id");
    var it=items.filter(function(i){return i.id===id;})[0]; if(!it) return;
    var a=b.getAttribute("data-a");
    if(a==="plus") it.q+=step(it.u);
    else if(a==="minus") it.q=Math.max(0,it.q-step(it.u));
    else if(a==="del"){ if(!confirm("¿Eliminar «"+it.name+"» de la despensa?")) return; items=items.filter(function(i){return i.id!==id;}); }
    save(); render();
  });

  search.addEventListener("input",render);
  render();
})();
</script>
</body>
</html>
